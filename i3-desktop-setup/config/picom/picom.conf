// picom configuration — managed by i3-desktop-setup.
// The xrender backend is used deliberately: it avoids the GL/EGL pitfalls that
// the Raspberry Pi's VideoCore driver can hit with the glx backend.

backend = "xrender";
vsync = true;

// --- Shadows ---------------------------------------------------------------
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'i3-frame'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

// --- Fading ----------------------------------------------------------------
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

// --- Opacity ---------------------------------------------------------------
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
// Honour per-window opacity (e.g. Alacritty's window.opacity).
detect-client-opacity = true;

// --- Behaviour -------------------------------------------------------------
detect-rounded-corners = true;
detect-transient = true;
use-damage = true;

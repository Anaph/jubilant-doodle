# Alacritty configuration — managed by i3-desktop-setup.
#
# The import line below is rewritten by the installer to match the selected
# --theme (default: tokyo_night). The full theme collection is cloned to
# ~/.config/alacritty/themes by the installer.

[general]
import = ["~/.config/alacritty/themes/themes/tokyo_night.toml"]

[env]
TERM = "alacritty"

[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
# Slight transparency; works together with the picom compositor.
opacity = 0.95
dynamic_title = true

[scrolling]
history = 10000

[font]
size = 11.0
normal = { family = "Fira Code", style = "Regular" }
bold = { family = "Fira Code", style = "Bold" }
italic = { family = "Fira Code", style = "Italic" }

[cursor]
style = { shape = "Block", blinking = "On" }

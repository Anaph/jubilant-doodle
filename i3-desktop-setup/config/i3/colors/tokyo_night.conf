# Tokyo Night palette for i3 — managed by i3-desktop-setup.
set $bg     #1a1b26
set $bg_alt #24283b
set $fg     #c0caf5
set $fg_dim #565f89
set $accent #7aa2f7
set $urgent #f7768e

# class                 border   backgr.  text     indicator child_border
client.focused          $accent  $accent  $bg      $accent   $accent
client.focused_inactive $bg_alt  $bg_alt  $fg      $bg_alt   $bg_alt
client.unfocused        $bg      $bg      $fg_dim  $bg       $bg_alt
client.urgent           $urgent  $urgent  $bg      $urgent   $urgent
client.placeholder      $bg      $bg      $fg      $bg       $bg
client.background       $bg
